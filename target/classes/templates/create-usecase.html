<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Use Case</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/projects">RequirementsApp</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/projects">Projects</a>
            <a class="nav-link" href="/profile">Profile</a>
            <a class="nav-link" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h1 class="mb-4">Create Use Case</h1>

    <form th:action="@{'/projects/' + ${project.id} + '/usecases'}"
          th:object="${useCase}" method="post">

        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" th:field="*{title}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Preconditions</label>
            <textarea th:field="*{preconditions}" class="form-control" rows="2"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Main Flow</label>
            <textarea th:field="*{mainFlow}" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Alternative Flow</label>
            <textarea th:field="*{alternativeFlow}" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Postconditions</label>
            <textarea th:field="*{postconditions}" class="form-control" rows="2"></textarea>
        </div>

        <button type="submit" class="btn btn-success">Save Use Case</button>
        <a th:href="@{'/projects/' + ${project.id} + '/usecases'}" class="btn btn-secondary">Back</a>

    </form>

</div>

</body>
</html>
