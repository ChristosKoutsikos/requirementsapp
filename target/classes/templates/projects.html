<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/projects">RequirementsApp</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/projects">Projects</a>
            <a class="nav-link" href="/profile">Profile</a>
            <a class="nav-link" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Your Projects</h1>
        <a href="/projects/new" class="btn btn-primary">Create New Project</a>
    </div>

    <div th:if="${#lists.isEmpty(projects)}" class="alert alert-info">
        You have not created any projects yet.
    </div>

    <div class="list-group">
        <div class="list-group-item mb-3" th:each="p : ${projects}">

            <h4 th:text="${p.title}"></h4>
            <p class="text-muted" th:text="${p.description}"></p>

            <div class="mb-2">
                <a th:href="@{'/projects/edit/' + ${p.id}}" class="btn btn-warning btn-sm">Edit</a>
                <a th:href="@{'/projects/delete/' + ${p.id}}" class="btn btn-danger btn-sm">Delete</a>
                <a th:href="@{'/projects/' + ${p.id} + '/usecases'}" class="btn btn-secondary btn-sm">Use Cases</a>
                <a th:href="@{'/projects/' + ${p.id} + '/crc-cards'}" class="btn btn-secondary btn-sm">CRC Cards</a>
            </div>

            <div>
                <a th:href="@{'/projects/' + ${p.id} + '/diagrams/usecases/PLANTUML'}" class="btn btn-outline-dark btn-sm">
                    UC PlantUML
                </a>
                <a th:href="@{'/projects/' + ${p.id} + '/diagrams/usecases/NOMNOML'}" class="btn btn-outline-dark btn-sm">
                    UC Nomnoml
                </a>
                <a th:href="@{'/projects/' + ${p.id} + '/diagrams/classes/PLANTUML'}" class="btn btn-outline-dark btn-sm">
                    Class PlantUML
                </a>
                <a th:href="@{'/projects/' + ${p.id} + '/diagrams/classes/NOMNOML'}" class="btn btn-outline-dark btn-sm">
                    Class Nomnoml
                </a>
            </div>

        </div>
    </div>

</div>

</body>
</html>
