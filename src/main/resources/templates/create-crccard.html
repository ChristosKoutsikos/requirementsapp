<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create CRC Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/projects">RequirementsApp</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/projects">Projects</a>
            <a class="nav-link" href="/profile">Profile</a>
            <a class="nav-link" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h1 class="mb-4">Create CRC Card</h1>

    <form th:action="@{'/projects/' + ${project.id} + '/crc-cards'}"
          th:object="${crcCard}" method="post">

        <div class="mb-3">
            <label class="form-label">Class Name</label>
            <input type="text" th:field="*{className}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Responsibilities</label>
            <textarea th:field="*{responsibilities}" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Collaborations</label>
            <textarea th:field="*{collaborations}" class="form-control" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-success">Save CRC Card</button>
        <a th:href="@{'/projects/' + ${project.id} + '/crc-cards'}" class="btn btn-secondary">Back</a>

    </form>

</div>

</body>
</html>
