<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CRC Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/projects">RequirementsApp</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/projects">Projects</a>
            <a class="nav-link" href="/profile">Profile</a>
            <a class="nav-link" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h1 class="mb-3" th:text="'CRC Cards of Project: ' + ${project.title}"></h1>

    <div class="mb-4">
        <a th:href="@{'/projects/' + ${project.id} + '/crc-cards/new'}" class="btn btn-primary">
            Create New CRC Card
        </a>

        <a href="/projects" class="btn btn-secondary">
            Back to Projects
        </a>
    </div>

    <div th:if="${#lists.isEmpty(cards)}" class="alert alert-info">
        No CRC cards have been created for this project yet.
    </div>

    <div class="card mb-3" th:each="card : ${cards}">
        <div class="card-body">
            <h4 class="card-title" th:text="${card.className}"></h4>

            <p class="card-text">
                <strong>Responsibilities:</strong>
                <span th:text="${card.responsibilities}"></span>
            </p>

            <p class="card-text">
                <strong>Collaborations:</strong>
                <span th:text="${card.collaborations}"></span>
            </p>

            <hr>

            <h6>Linked Use Cases</h6>

            <div th:if="${#lists.isEmpty(card.useCases)}" class="text-muted">
                No linked use cases yet.
            </div>

            <ul th:if="${!#lists.isEmpty(card.useCases)}">
                <li th:each="uc : ${card.useCases}" th:text="${uc.title}"></li>
            </ul>

            <form th:action="@{'/crc-cards/' + ${card.id} + '/link-usecase'}" method="post" class="row g-2 mt-3">

                <div class="col-md-8">
                    <select name="useCaseId" class="form-select" required>
                        <option value="">Select Use Case</option>
                        <option th:each="uc : ${useCases}"
                                th:value="${uc.id}"
                                th:text="${uc.title}">
                        </option>
                    </select>
                </div>

                <div class="col-md-4">
                    <button type="submit" class="btn btn-outline-primary w-100">
                        Link Use Case
                    </button>
                </div>

            </form>

            <div class="mt-3">
                <a th:href="@{'/crc-cards/delete/' + ${card.id}}" class="btn btn-danger btn-sm">
                    Delete
                </a>
            </div>
        </div>
    </div>

</div>

</body>
</html>
