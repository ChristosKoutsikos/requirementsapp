<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Use Cases</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/projects">RequirementsApp</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/projects">Projects</a>
            <a class="nav-link" href="/profile">Profile</a>
            <a class="nav-link" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h1 th:text="'Use Cases of Project: ' + ${project.title}"></h1>

    <a th:href="@{'/projects/' + ${project.id} + '/usecases/new'}" class="btn btn-primary mb-3">
        Create Use Case
    </a>

    <a href="/projects" class="btn btn-secondary mb-3">Back</a>

    <div class="card mb-3" th:each="uc : ${useCases}">
        <div class="card-body">

            <h4 th:text="${uc.title}"></h4>

            <p><b>Main Flow:</b> <span th:text="${uc.mainFlow}"></span></p>

            <hr>

            <h6>Actors</h6>

            <ul>
                <li th:each="a : ${uc.actors}" th:text="${a.name}"></li>
            </ul>

            <form th:action="@{'/usecases/' + ${uc.id} + '/add-actor'}" method="post" class="row g-2">

                <div class="col-md-8">
                    <input type="text" name="actorName" class="form-control" placeholder="New Actor Name" required>
                </div>

                <div class="col-md-4">
                    <button class="btn btn-outline-primary w-100">Add Actor</button>
                </div>

            </form>

            <div class="mt-3">
                <a th:href="@{'/usecases/delete/' + ${uc.id}}" class="btn btn-danger btn-sm">
                    Delete
                </a>
            </div>

        </div>
    </div>

</div>

</body>
</html>
